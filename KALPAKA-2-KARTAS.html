<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalpaka spēle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap">
<style>
/* TV quiz studio: projector host screen + phone controller. Single dark look by choice. */
:root{
  color-scheme:dark;
  --stage:#0d1226; --stage-2:#151c3a; --panel:#1b2348; --line:#2e3a6e;
  --ink:#f4f1e8; --ink-soft:#aab3d6; --gold:#f5c542;
  --orange:#f08a24; --green:#22a861; --carmine:#a1323a; --blue:#2e6fd8; --purple:#7b4fc9;
  --ok:#35c46f; --bad:#e2565c;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:clamp(15px,1.15vw,19px);
  background-image:radial-gradient(60vw 40vh at 20% -5%,#26306a 0,transparent 70%),radial-gradient(50vw 40vh at 85% 0,#3a1f4e 0,transparent 70%);background-attachment:fixed}
#app{min-height:100%;display:flex;flex-direction:column;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border-radius:12px;padding:.7em 1.2em;background:var(--panel);border:1px solid var(--line);font-weight:700;transition:transform .12s,background .15s}
button:hover{background:#252f5e}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.primary:hover{background:#ffd35e}
.ghost{background:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.eyebrow{font-size:.8em;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);font-weight:800}
.note{font-size:.88em;color:var(--ink-soft);line-height:1.5}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:900;font-size:clamp(18px,1.6vw,26px)}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.55em;color:var(--ink-soft);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.45em .9em;border-radius:999px;background:var(--stage-2);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.chip b{color:var(--gold)}
.card{background:var(--stage-2);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:800;font-size:.9em}
input[type=text],select{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:.7em .9em;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.demo{margin-bottom:18px;background:#3a2a07;border:1px solid var(--gold);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9em}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:2vh}
.hero h1{font-size:clamp(30px,4.2vw,64px);font-weight:900;line-height:1.05}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--ink-soft);max-width:60ch;line-height:1.55}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.legend div{display:flex;gap:10px;align-items:center;font-weight:700}
.legend i{width:22px;height:22px;border-radius:6px;flex:none}

/* Lobby */
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,3vw,48px);align-items:start}
.qr{background:#fff;border-radius:18px;padding:14px;width:clamp(220px,24vw,360px);max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.pin{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,6vw,104px);letter-spacing:.08em;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.url{font-weight:800;font-size:clamp(15px,1.4vw,22px);word-break:break-all}
.teamcloud{display:flex;flex-wrap:wrap;gap:10px}
.teamcloud span{padding:.55em 1em;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;animation:pop .35s both}

/* Board */
.board{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,24px)}
.tile{position:relative;border-radius:24px;padding:clamp(18px,2.2vw,34px);text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:clamp(150px,30vh,320px);border:0;color:#fff;overflow:hidden;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.35)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 15% 0,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.tile:hover{transform:translateY(-3px);filter:brightness(1.07)}
.tile .num{font-family:var(--f-display);font-weight:900;font-size:clamp(42px,6vw,96px);line-height:.9;opacity:.25;position:absolute;right:22px;bottom:10px}
.tile h2{font-size:clamp(22px,2.6vw,42px);font-weight:900;line-height:1.08;max-width:14ch}
.tile .sub{font-weight:700;opacity:.9;margin-top:8px}
.dots{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.dots span{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.9)}
.dots span.used{background:rgba(0,0,0,.28)}
.tile:disabled{filter:grayscale(.85) brightness(.55);opacity:1}
.c-purple{background:var(--purple)} .c-orange{background:var(--orange)} .c-green{background:var(--green)} .c-carmine{background:var(--carmine)} .c-blue{background:var(--blue)}
.board.board5{grid-template-columns:repeat(3,minmax(0,1fr))}
.finalist{background:var(--gold)!important;color:#1a1405;border-color:var(--gold)!important}
.podium3{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,28px);width:min(900px,100%);margin-top:10px}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.pod .who-n{font-family:var(--f-display);font-weight:900;font-size:clamp(16px,2vw,30px);text-align:center;min-height:1.3em;color:var(--ink-soft)}
.pod.on .who-n{color:var(--ink);animation:pop .5s both}
.pod .pts{font-weight:800;color:var(--ink-soft)}
.pod .step{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:14px;background:var(--panel);border:1px solid var(--line);border-bottom:0}
.pod .step span{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4vw,60px);color:var(--ink-soft)}
.pod1 .step{height:clamp(150px,26vh,280px)} .pod2 .step{height:clamp(110px,18vh,200px)} .pod3 .step{height:clamp(80px,12vh,140px)}
.pod1.on .step{background:linear-gradient(#6b5212,#2a2208);border-color:var(--gold)} .pod1.on .step span{color:var(--gold)}
.pod2.on .step{background:linear-gradient(#5b6075,#2b2f3d)} .pod2.on .step span{color:#e3e6f0}
.pod3.on .step{background:linear-gradient(#7a4a22,#3a2410)} .pod3.on .step span{color:#f0b27a}
.picker{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,1.6vw,24px)}
.picker b{color:var(--gold)}

/* Question */
.qwrap{flex:1;display:flex;flex-direction:column;gap:clamp(14px,2vh,26px)}
.band{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:14px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:clamp(14px,1.2vw,19px)}
.qtext{font-family:var(--f-display);font-weight:700;line-height:1.2;font-size:clamp(26px,3.4vw,58px);max-width:28ch}
.qtext.small{font-size:clamp(20px,2.3vw,38px);max-width:40ch}
.tfbadge{display:inline-block;font-family:var(--f-display);font-size:.5em;color:var(--gold);margin-bottom:.4em;letter-spacing:.08em}
.timer{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:clamp(110px,13vw,190px);aspect-ratio:1;max-width:100%;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(32px,4vw,62px);font-variant-numeric:tabular-nums}
.ring.warn .t{color:var(--bad)}
.msg{font-size:clamp(18px,1.6vw,26px);font-weight:800;line-height:1.35}
.msg span{display:block;color:var(--ink-soft);font-weight:600;font-size:.75em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,20px)}
.opt{display:flex;gap:16px;align-items:center;padding:clamp(14px,1.6vw,24px);border-radius:18px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:clamp(18px,1.7vw,30px);line-height:1.25;min-width:0;animation:pop .35s both;text-align:left}
.opt .L{font-family:var(--f-display);font-weight:900;width:2em;height:2em;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--stage);color:var(--gold)}
.opt.right{background:#173d2a;border-color:var(--ok)} .opt.right .L{background:var(--ok);color:#06210f}
.opt.dim{opacity:.35}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.explain{background:var(--stage-2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;line-height:1.5}
.explain .src{color:var(--ink-soft);font-size:.85em;margin-top:6px}
.answered{display:flex;flex-wrap:wrap;gap:8px}
.answered span{padding:.4em .9em;border-radius:999px;border:1px solid var(--line);font-weight:700;color:var(--ink-soft)}
.answered span.yes{background:var(--panel);color:var(--ink);border-color:var(--gold)}
.footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:10px}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(5,8,20,.88);display:grid;place-items:center;padding:24px;z-index:20}
.sheet{background:var(--stage-2);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(560px,100%);display:grid;gap:14px;max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-family:var(--f-display);font-weight:700}

/* Final */
.final{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;justify-content:center}
.final h1{font-size:clamp(30px,4.5vw,72px);font-weight:900}
.podium{display:grid;gap:12px;width:min(760px,100%)}
.place{display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:clamp(18px,1.8vw,30px);animation:pop .5s both}
.place .p{font-family:var(--f-display);font-weight:900;width:2.2em;color:var(--ink-soft)}
.place .s{margin-left:auto;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.place.first{background:linear-gradient(90deg,#5a4510,#2a2208);border-color:var(--gold)}
.place.first .p{color:var(--gold)}
.hidden-slot{opacity:.3;border-style:dashed}

/* Phone (player) */
.phone{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px;font-size:17px}
.phone .who{display:flex;align-items:center;gap:10px;font-weight:800}
.phone .who b{color:var(--gold)}
.phone .big{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,7vw,34px);line-height:1.15}
.phone .qtext{font-size:clamp(20px,5.6vw,28px)}
.phone .opts{grid-template-columns:1fr}
.phone .opt{font-size:19px;padding:16px;cursor:pointer;width:100%}
.phone .opt.sel{border-color:var(--gold);background:#3a2f0b}
.phone .opt.sel .L{background:var(--gold);color:#1a1405}
.phone .ring{width:110px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;align-items:center}
.result{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,9vw,44px)}
.result.ok{color:var(--ok)} .result.no{color:var(--bad)}
.err{color:var(--bad);font-weight:700}

@media (max-width:760px){
  .home,.board,.board.board5,.opts,.two,.legend,.lobby{grid-template-columns:1fr}
  .tile{min-height:140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var qrcode = function() {

  // qrcode

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var _dataList = [];

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);

      setupTimingPattern();

      if (_typeNumber >= 7) {

      }

      if (_dataCache == null) {

      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }

      }

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

              } else {

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

            if (_modules[row][col - c] == null) {

              if (byteIndex < data.length) {

            break;

      var maxDcCount = 0;
      var maxEcCount = 0;

    if(DEMO){let last;const s={fire:()=>{const v=this._at(this._read(),p)??null;const j=JSON.stringify(v);if(j!==last){last=j;cb(v)}}};this._subs.push(s);s.fire();return()=>{this._subs=this._subs.filter(x=>x!==s)}}
    const r=this.db.ref(p);const h=r.on("value",s=>cb(s.val()),e=>console.warn(p,e));return()=>r.off("value",h);
  }
};

/* ---------- Kopīgas skata detaļas ---------- */
let audioCtx=null;
function beep(on){if(!on)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=660;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.6);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.65)}catch(e){}}
const RL=2*Math.PI*54;
function ring(total,col){return `<div class="ring" data-total="${total}" role="timer" aria-label="Atlikušais laiks"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#2e3a6e" stroke-width="10"/><circle class="fg" cx="60" cy="60" r="54" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${RL}" stroke-dashoffset="0"/></svg><div class="t"></div></div>`}
function paintRing(rem){const el=document.querySelector(".ring");if(!el)return;const tot=+el.dataset.total||1;el.querySelector("circle.fg").style.strokeDashoffset=RL*(1-Math.min(1,rem/tot));el.querySelector(".t").textContent=Math.ceil(rem);el.classList.toggle("warn",rem<=10)}
function remOf(st){if(!st||!st.endsAt)return 0;if(st.pausedRem)return st.pausedRem;return Math.max(0,(st.endsAt-Store.now())/1000)}
const brand=`<div class="brand">Kalpaka spēle<small>Pulkvedis Oskars Kalpaks · 1882–1919</small></div>`;
const demoBar=()=>DEMO?`<div class="demo"><b>Demo režīms.</b> Firebase vēl nav pieslēgts, tāpēc spēle darbojas tikai šajā datorā. Skolēna skatu vari izmēģināt citā šī pārlūka cilnē.</div>`:"";
function baseUrl(){return location.origin+location.pathname}
function qrSvg(text){try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){return ""}}

   SKOLOTĀJS (galvenais ekrāns)

const H={code:null,st:null,teams:{},scores:{},answers:{},overlay:false,revealN:0,unsubs:[],ansUnsub:null,tick:null,lastBeep:null,
  settings:Object.assign({discuss:60,answer:20,sound:true},LS.get("kspele-settings")||{})};
const gp=p=>`games/${H.code}/${p}`;
const stageOf=()=>H.st?.stage||1;
function allTeams(){return Object.entries(H.teams).map(([id,t])=>({id,name:t.name,t:t.t||0})).sort((a,b)=>a.t-b.t)}
function isFin(id){return !!(H.st?.fin&&H.st.fin[id])}
/* Komandas, kas spēlē pašreizējā kārtā */
function teamList(){const all=allTeams();return stageOf()===2?all.filter(t=>isFin(t.id)):all}
function scoreOf(id,stage){return (H.scores["r"+(stage||stageOf())]||{})[id]||0}
function qsFor(cid,stage){return Q.filter(q=>q.c===cid&&q.r===stage)}
function leftIn(cid){const used=H.st?.used||[];return qsFor(cid,stageOf()).filter(q=>!used.includes(q.id))}
function stageCats(stage){return CATS.filter(c=>qsFor(c.id,stage).length)}
function stageLeft(stage){const used=H.st?.used||[];return Q.filter(q=>q.r===stage&&!used.includes(q.id)).length}
const STAGE_NAME={1:"1. kārta",2:"2. kārta · Fināls"};

async function hostStart(){
  const saved=LS.get("kspele-host");
  if(saved&&saved.code){const host=await Store.get(`games/${saved.code}/host`);if(host===Store.uid){H.code=saved.code;attach();return}}
  hostRender();
}
async function createGame(){
  let code;for(let i=0;i<20;i++){code=String(Math.floor(100000+Math.random()*900000));if(!(await Store.get(`games/${code}/host`)))break}
  H.code=code;
  await Store.set(gp("host"),Store.uid);
  await Store.set(gp("state"),{phase:"lobby",stage:1,used:[],picker:0,n:0,discuss:H.settings.discuss,answer:H.settings.answer,created:Store.now()});
  LS.set("kspele-host",{code});attach();
}
function attach(){
  H.unsubs.forEach(u=>u());H.unsubs=[];
  H.unsubs.push(Store.on(gp("state"),v=>{H.st=v;watchAnswers();hostRender()}));
  H.unsubs.push(Store.on(gp("teams"),v=>{H.teams=v||{};if(!["discuss","answer","locked"].includes(H.st?.phase))hostRender();else paintAnswered()}));
  H.unsubs.push(Store.on(gp("scores"),v=>{H.scores=v||{}}));
  clearInterval(H.tick);H.tick=setInterval(hostTick,200);
}
function watchAnswers(){
  const qid=H.st?.qid;
  if(H._ansQ===qid)return;
  if(H.ansUnsub){H.ansUnsub();H.ansUnsub=null}
  H._ansQ=qid;H.answers={};
  if(qid)H.ansUnsub=Store.on(gp("answers/"+qid),v=>{H.answers=v||{};paintAnswered()});
}
function hostTick(){
  const st=H.st;if(!st)return;
  if(st.phase==="discuss"||(st.phase==="answer"&&st.endsAt)){
    const r=remOf(st);paintRing(r);
    if(r<=0&&!st.pausedRem){
      const key=st.phase+st.qid;if(H.lastBeep!==key){H.lastBeep=key;beep(H.settings.sound)}
      if(st.phase==="discuss")toAnswer();else setState({phase:"locked",endsAt:null});
    }
  }
}
async function setState(patch){const st=Object.assign({},H.st,patch);Object.keys(st).forEach(k=>st[k]===undefined&&delete st[k]);H.st=st;await Store.set(gp("state"),st)}
function qPatch(cid,used){
  const pool=qsFor(cid,stageOf()).filter(q=>!used.includes(q.id));if(!pool.length)return null;
  const q=pool[Math.floor(Math.random()*pool.length)];
  const order=q.tf?["Patiesība","Nepatiesība"]:shuffle(q.o);
  return {phase:"discuss",qid:q.id,cat:cid,order,correct:null,right:null,n:(H.st.n||0)+1,endsAt:Store.now()+H.st.discuss*1000,pausedRem:null};
}
function openCat(cid){
  const used=H.st.used||[];const p=qPatch(cid,used);if(!p)return;
  const total=qsFor(cid,stageOf()).filter(q=>!used.includes(q.id)).length;
  setState(Object.assign(p,{round:cid,roundIdx:1,roundTotal:total}));
}
function toAnswer(){const a=H.st.answer;setState({phase:"answer",endsAt:a>0?Store.now()+a*1000:null,pausedRem:null})}
async function reveal(){
  const st=H.st,q=qById(st.qid);const ci=st.order.indexOf(correctText(q));const stage=stageOf();
  const ans=(await Store.get(gp("answers/"+st.qid)))||H.answers||{};
  const eligible=new Set(teamList().map(t=>t.id));
  const upd={};let right=0;
  Object.entries(ans).forEach(([id,v])=>{if(v===ci&&eligible.has(id)){right++;upd["r"+stage+"/"+id]=scoreOf(id,stage)+1}});
  if(Object.keys(upd).length)await Store.update(gp("scores"),upd);
  await setState({phase:"reveal",correct:ci,right,endsAt:null,pausedRem:null});
}
function nextQ(stay){
  const st=H.st;const n=teamList().length||1;const used=(st.used||[]).concat(st.qid);
  const p=stay&&st.round?qPatch(st.round,used):null;
  if(p){setState(Object.assign(p,{used,roundIdx:(st.roundIdx||1)+1}));return}
  setState({phase:"board",used,picker:((st.picker||0)+1)%n,qid:null,cat:null,order:null,correct:null,right:null,round:null,roundIdx:null,roundTotal:null});
}
function moreInRound(){const st=H.st;if(!st||!st.round)return 0;const used=(st.used||[]).concat(st.qid);return qsFor(st.round,stageOf()).filter(q=>!used.includes(q.id)).length}
function togglePause(){const st=H.st;if(st.pausedRem){setState({endsAt:Store.now()+st.pausedRem*1000,pausedRem:null})}else{setState({pausedRem:Math.max(.5,remOf(st))})}}
function plus15(){const st=H.st;const el=document.querySelector(".ring");if(st.pausedRem)setState({pausedRem:st.pausedRem+15});else setState({endsAt:st.endsAt+15000});if(el)el.dataset.total=+el.dataset.total+15}

/* Finālisti: labākā puse komandu (vismaz 3, lai būtu 1.–3. vieta); vienāds punktu skaits ar pēdējo finālistu arī iekļūst. */
function qualifyCalc(){
  const ts=allTeams().map(t=>({id:t.id,name:t.name,s:scoreOf(t.id,1)})).sort((a,b)=>b.s-a.s);
  if(!ts.length)return {fin:{},threshold:0,k:0};
  const k=ts.length<=3?ts.length:Math.max(3,Math.ceil(ts.length/2));
  const threshold=ts[k-1].s;const fin={};ts.forEach(t=>{if(t.s>=threshold)fin[t.id]=true});
  return {fin,threshold,k};
}
function toQualify(){const {fin,threshold}=qualifyCalc();setState({phase:"qualify",fin,threshold,round:null,qid:null});}
function startStage2(){setState({phase:"board",stage:2,picker:0,qid:null,round:null});}
function ranking(){
  const st=H.st;const pool=st?.fin?allTeams().filter(t=>isFin(t.id)):allTeams();
  const arr=pool.map(t=>({t:t.name,s:scoreOf(t.id,2),s1:scoreOf(t.id,1)})).sort((a,b)=>b.s-a.s||b.s1-a.s1);
  let place=0,prev=null;arr.forEach((r,i)=>{const key=r.s+"/"+r.s1;if(key!==prev){place=i+1;prev=key}r.p=place});return arr;
}

   <h3>Punktu tabula</h3><p class="note" style="margin:0">Aizver šo logu, pirms rādi ekrānu klasei.</p>
   <table><thead><tr><th>Komanda</th><th class="n">1. kārta</th><th class="n">Fināls</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.name)}${st2&&isFin(t.id)?" ★":""}</td><td class="n">${scoreOf(t.id,1)}</td><td class="n">${st2?(isFin(t.id)?scoreOf(t.id,2):"–"):"–"}</td></tr>`).join("")||'<tr><td colspan="3">Vēl nav komandu</td></tr>'}</tbody></table>
   <p class="note" style="margin:0">${st2?"★ finālists. ":""}1. kārtā atlikuši ${stageLeft(1)}, finālā ${stageLeft(2)} jautājumi.${!st2&&ts.length?" Ja 1. kārtu beigtu tagad, finālam vajadzētu vismaz "+qualifyCalc().threshold+" punktus.":""}</p>
   <div class="row"><span class="spacer"></span><button class="primary" data-a="closeT">Aizvērt</button></div></div></div>`;
}
function hostRender(){
  const st=H.st;let h;
  if(!H.code||!st)h=vHome();
  else if(st.phase==="lobby"||H.showLobby)h=vLobby();
  else if(st.phase==="board")h=vBoard();
  else if(st.phase==="qualify")h=vQualify();
  else if(st.phase==="final")h=vFinal();
  else h=vHostQ();
  if(H.overlay&&H.code)h+=vTeacher();
  if(H.confirm&&H.code)h+=`<div class="overlay" data-a="noRestart"><div class="sheet" role="dialog" aria-label="Sākt no jauna" data-stop="1"><h3>Sākt jaunu spēli?</h3><p class="note" style="margin:0">Pašreizējā spēle beigsies, un tās punkti tiks dzēsti. Komandām būs jānoskenē jaunais QR kods.</p><div class="row"><span class="spacer"></span><button data-a="noRestart">Atcelt</button><button class="primary" data-a="restart">Jā, sākt no jauna</button></div></div></div>`;
  app.innerHTML=h;
  if(H.showLobby&&st&&st.phase!=="lobby"){const r=app.querySelector('[data-a="startGame"]');if(r){r.textContent="Atpakaļ pie spēles";r.disabled=false;r.dataset.a="hideLobby"}}
  paintAnswered();if(st)paintRing(remOf(st));
}
async function endGame(){
  H.unsubs.forEach(u=>u());H.unsubs=[];if(H.ansUnsub)H.ansUnsub();H.ansUnsub=null;clearInterval(H.tick);
  if(H.code){try{await Store.set(gp("state"),{phase:"ended"})}catch(e){}}
  LS.del("kspele-host");H.code=null;H.st=null;H.teams={};H.scores={};H._ansQ=null;H.revealN=0;H.showLobby=false;hostRender();
}
function hostClick(a,el){
  switch(a){
   case "startGame":setState({phase:"board",stage:1});break;
   case "lobby":H.showLobby=true;hostRender();break;
   case "hideLobby":H.showLobby=false;hostRender();break;
   case "open":openCat(el.dataset.c);break;
   case "showOpts":toAnswer();break;
   case "pause":togglePause();break;
   case "plus":plus15();break;
   case "reveal":reveal();break;
   case "next":nextQ(true);break;
   case "endRound":nextQ(false);break;
   case "teacher":H.overlay=true;hostRender();break;
   case "closeT":H.overlay=false;hostRender();break;
   case "toQualify":toQualify();break;
   case "back1":setState({phase:"board",stage:1,fin:null,threshold:null});break;
   case "startStage2":startStage2();break;
   case "toFinal":H.revealN=0;setState({phase:"final"});break;
   case "revealNext":H.revealN++;hostRender();break;
   case "back":setState({phase:"board"});break;
   case "endGame":endGame();break;
   case "askRestart":H.confirm=true;hostRender();break;
   case "noRestart":H.confirm=false;hostRender();break;
   case "restart":H.confirm=false;endGame();break;
  }
}

/* =====================================================================
   SKOLĒNS (telefons)
   ===================================================================== */
const P={code:null,name:null,st:null,my:{},unsub:null,tick:null,err:""};
async function playerStart(code){
  P.code=code;
  const me=await Store.get(`games/${code}/teams/${Store.uid}`).catch(()=>null);
  if(me&&me.name)P.name=me.name;
  P.unsub=Store.on(`games/${code}/state`,v=>{
    const prevQ=P.st?.qid;P.st=v;
    if(v&&v.qid&&v.qid!==prevQ&&P.my[v.qid]===undefined)loadMine(v.qid);
    playerRender();
  });
  clearInterval(P.tick);P.tick=setInterval(()=>{const st=P.st;if(st&&(st.phase==="discuss"||st.phase==="answer"))paintRing(remOf(st))},250);
}
async function loadMine(qid){const v=await Store.get(`games/${P.code}/answers/${qid}/${Store.uid}`).catch(()=>null);if(v!==null&&v!==undefined){P.my[qid]=v;playerRender()}}
async function join(name){
  name=name.trim().slice(0,30);if(!name){P.err="Ieraksti komandas nosaukumu.";playerRender();return}
  if(P.busy)return;P.busy=true;P.err="";playerRender();
  try{
    const host=await Store.get(`games/${P.code}/host`);
    if(!host){P.err="Spēle ar kodu "+P.code+" nav atrasta. Noskenē QR kodu no lielā ekrāna vēlreiz.";}
    else{await Store.set(`games/${P.code}/teams/${Store.uid}`,{name,t:Store.now()});P.name=name;LS.set("kspele-player",{code:P.code,name})}
  }catch(e){
    const already=await Store.get(`games/${P.code}/teams/${Store.uid}`).catch(()=>null);
    if(already&&already.name){P.name=already.name}
    else P.err="Neizdevās pievienoties ("+(e&&(e.code||e.message)||"nezināma kļūda")+"). Pārlādē lapu un mēģini vēlreiz.";
  }
  P.busy=false;
  playerRender();
}
async function choose(i){
  const st=P.st;if(!st||st.phase!=="answer")return;
  if(st.endsAt&&remOf(st)<=0)return;
  P.my[st.qid]=i;playerRender();
  try{await Store.set(`games/${P.code}/answers/${st.qid}/${Store.uid}`,i)}catch(e){P.err="Atbildi neizdevās nosūtīt. Laiks varēja būt beidzies.";playerRender()}
}
function vCodeEntry(){
  return `<div class="phone"><div class="topbar">${brand}</div>${demoBar()}
   <form class="card" id="codeForm"><h3>Pievienoties spēlei</h3>
    <div class="field"><label for="code">Spēles kods no lielā ekrāna</label><input type="text" id="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="123456"></div>
    <button type="submit" class="primary">Tālāk</button></form>
   <p class="note">Vai tu esi skolotājs? <a href="?host" style="color:var(--gold)">Atvērt skolotāja ekrānu</a></p></div>`;
}
function playerRender(){
  const st=P.st;let h=`<div class="phone"><div class="topbar">${brand}</div>`;
  if(P.name)h+=`<div class="who">Komanda: <b>${esc(P.name)}</b></div>`;
  if(!st||st.phase==="ended"){h+=`<div class="center"><div class="big">${st?"Spēle ir beigusies":"Spēle nav atrasta"}</div><p class="note">${st?"Paldies par piedalīšanos!":"Pārbaudi kodu uz lielā ekrāna."}</p><a href="${baseUrl()}" style="color:var(--gold)">Ievadīt citu kodu</a></div>`}
  else if(!P.name){
    h+=`<form class="card" id="joinForm"><h3>Jūsu komandas nosaukums</h3><div class="field"><label for="tname">Nosaukums būs redzams tikai skolotāja ekrānā</label><input type="text" id="tname" maxlength="30" autocomplete="off" placeholder="Piemēram, Kalpaka strēlnieki"></div>${P.err?`<div class="err">${esc(P.err)}</div>`:""}<button type="submit" class="primary" ${P.busy?"disabled":""}>${P.busy?"Pievienojas…":"Pievienoties"}</button></form>`;
  }
  else if(st.phase==="qualify"){const ok=st.fin&&st.fin[Store.uid];h+=`<div class="center"><div class="result ${ok?"ok":"no"}">${ok?"Jūs esat finālā!":"Šoreiz finālā netikāt"}</div><p class="note">${ok?"Gatavojieties 2. kārtai. Finālā visi sāk no nulles.":"Paldies par lielisku spēli! Vērojiet finālu uz lielā ekrāna."}</p></div>`}
  else if(st.stage===2&&!(st.fin&&st.fin[Store.uid])&&st.phase!=="final"){h+=`<div class="center"><div class="big">Fināls ir sācies</div><p class="note">Jūsu komanda šoreiz finālā netika. Vērojiet spēli uz lielā ekrāna un mēģiniet atbildēt prātā!</p></div>`}
  else if(st.phase==="lobby"||st.phase==="board"){h+=`<div class="center"><div class="big">${st.phase==="lobby"?"Jūs esat spēlē!":"Skatieties uz lielo ekrānu"}</div><p class="note">${st.phase==="lobby"?"Gaidām, kad skolotājs sāks spēli.":(st.stage===2?"Fināls. Tiek izvēlēta nākamā krāsa.":"Tiek izvēlēta nākamā krāsa.")}</p></div>`}
  else if(st.phase==="final"){h+=`<div class="center"><div class="big">Spēle beigusies!</div><p class="note">Rezultāti tiek paziņoti uz lielā ekrāna.</p></div>`}
  else{
    const q=qById(st.qid),c=cat(q.c),mine=P.my[st.qid];
    h+=`<div class="band" style="background:${c.color}">${esc(c.name)}</div><div class="qtext">${q.tf?'<span class="tfbadge">PATIESĪBA VAI NEPATIESĪBA?</span><br>':""}${esc(q.q)}</div>`;
    if(st.phase==="discuss")h+=`<div class="timer">${ring(st.discuss,c.color)}<div class="msg">Apspriedieties!<span>Atbilžu varianti parādīsies pēc brīža.</span></div></div>`;
    else if(st.phase==="answer"){
      if(st.endsAt)h+=`<div class="timer">${ring(st.answer,c.color)}<div class="msg">${mine===undefined?"Izvēlieties atbildi!":"Atbilde nosūtīta"}<span>${mine===undefined?"Vienojieties komandā un spiediet.":"Vēl varat to mainīt."}</span></div></div>`;
      h+=`<div class="opts">${st.order.map((o,i)=>`<button class="opt ${mine===i?"sel":""}" data-a="choose" data-i="${i}"><span class="L">${q.tf?(i?"N":"P"):"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
      if(P.err)h+=`<div class="err">${esc(P.err)}</div>`;
    }
    else if(st.phase==="locked")h+=`<div class="center"><div class="big">Laiks beidzies</div><p class="note">${mine===undefined?"Šoreiz atbilde netika nosūtīta.":"Jūsu atbilde: "+esc(st.order[mine])}</p></div>`;
    else if(st.phase==="reveal"){
      const ok=mine===st.correct;
      h+=`<div class="center"><div class="result ${ok?"ok":"no"}">${mine===undefined?"Nav atbildes":ok?"Pareizi!":"Šoreiz nē"}</div><p class="note">Pareizā atbilde: <b>${esc(st.order[st.correct])}</b></p></div>`;
    }
  }
  h+=`</div>`;app.innerHTML=h;if(st)paintRing(remOf(st));
}

/* ---------- Notikumi ---------- */
let MODE="choose";
app.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="newGame"){H.settings={discuss:+document.getElementById("discuss").value,answer:+document.getElementById("answer").value,sound:document.getElementById("sound").checked};LS.set("kspele-settings",H.settings);createGame()}
  if(e.target.id==="codeForm"){const c=document.getElementById("code").value.replace(/\D/g,"");if(c.length===6)location.search="?g="+c}
  if(e.target.id==="joinForm")join(document.getElementById("tname").value);
});
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  if(el.classList.contains("overlay")&&e.target.closest("[data-stop]"))return;
  const a=el.dataset.a;
  if(a==="fs"){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}return}
  if(MODE==="host")hostClick(a,el);
  if(MODE==="player"&&a==="choose")choose(+el.dataset.i);
});
document.addEventListener("keydown",e=>{
  if(MODE!=="host"||e.target.matches("input,select,textarea"))return;
  if(e.key==="Escape"&&(H.overlay||H.confirm)){H.overlay=false;H.confirm=false;hostRender();return}
  if((e.key==="t"||e.key==="T")&&H.code){H.overlay=!H.overlay;hostRender();return}
  if(H.overlay||H.confirm||e.target.closest("button"))return;
  if(e.key===" "||e.key==="Enter"){
    const ph=H.st?.phase;const map={discuss:"showOpts",answer:"reveal",locked:"reveal",reveal:moreInRound()?"next":"endRound",qualify:"startStage2",final:"revealNext"};
    const b=map[ph]&&document.querySelector(`.footer [data-a="${map[ph]}"], .final [data-a="${map[ph]}"]`);if(b){e.preventDefault();b.click()}
  }
});

(async function boot(){
  app.innerHTML=`<div class="center"><div class="big">Ielādē…</div></div>`;
  try{await Store.init()}catch(e){app.innerHTML=`<div class="phone"><div class="center"><div class="big">Neizdevās savienoties</div><p class="note">Pārbaudi interneta savienojumu un pārlādē lapu.</p></div></div>`;console.error(e);return}
  const qs=new URLSearchParams(location.search);const g=(qs.get("g")||"").replace(/\D/g,"");
  if(g.length===6){MODE="player";playerStart(g)}
  else if(qs.has("host")||!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){MODE="host";hostStart()}
  else{MODE="player";app.innerHTML=vCodeEntry()}
})();
</script>
</body>
